<script>
// ==================================================
// REDIRECIONAMENTO DISCORD
// Executa somente uma vez por sessão.
// Ao voltar para a página, não entra em loop.
// ==================================================

(function(){

  const DISCORD_URL = "https://discord.gg/W7yq8xCvsm";
  const STORAGE_KEY = "terra_garora_discord_redirect";

  const splash = document.getElementById("discordSplash");
  const count = document.getElementById("discordCount");

  function hideSplash(){
    if(splash){
      splash.style.display = "none";
    }
  }

  function startRedirect(){

    if(sessionStorage.getItem(STORAGE_KEY) === "1"){
      hideSplash();
      return;
    }

    sessionStorage.setItem(STORAGE_KEY, "1");

    let seconds = 3;

    if(count){
      count.textContent = seconds;
    }

    const timer = setInterval(() => {

      seconds--;

      if(count){
        count.textContent = seconds;
      }

      if(seconds <= 0){

        clearInterval(timer);

        window.location.href = DISCORD_URL;
      }

    }, 1000);
  }

  startRedirect();

  // Corrige o caso em que o Safari restaura a página pelo cache
  // ao voltar do Discord.
  window.addEventListener("pageshow", function(){

    if(sessionStorage.getItem(STORAGE_KEY) === "1"){
      hideSplash();
    }

  });

})();
</script>

  gun:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M9 7v10l3 4 3-4V7"/><line x1="10" y1="10" x2="14" y2="10"/><line x1="10" y1="14" x2="14" y2="14"/></svg>',

  spark:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/><line x1="18.4" y1="5.6" x2="5.6" y2="18.4"/></svg>',

  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg>',

  bolt:'<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
};

const TABS = [
  { id:'aim',   ico:ICO.target, title:'CONTROLE DE MIRA' },
  { id:'arma',  ico:ICO.gun,    title:'ARMA' },
  { id:'div',   ico:ICO.grid,   title:'DIVERSOS' },
  { id:'seg',   ico:ICO.shield, title:'SEGURANÇA' },
  { id:'inj',   ico:ICO.spark,  title:'INJEÇÃO' },
];

const state = {
  side:'aim',
  tog:{
    aimbot:false,
    aimSilent:false,
    semRecuo:false,
    rastreio:false,
    precisao:false,
    tremedeira:false,
    aprimorar:false,
    fps120:false,
    otim:false
  },
  fov:10,
  seg:50,
  inject:'idle',
  log:'',
};

const $ = id => document.getElementById(id);

function callNative(name, ...args){
  try{
    const ai=window.AndroidInterface;

    if(ai && typeof ai[name]==='function'){
      ai[name](...args);
      return true;
    }
  }catch(e){}

  return false;
}

const bridge = {
  aimbot:      v => callNative('Mapear_Aimbot_Ativar', v),
  aimSilent:   v => callNative('Mapear_AimSilent_Ativar', v),
  semRecuo:    v => callNative('Mapear_SemRecuo_Ativar', v),
  rastreio:    v => callNative('Mapear_RastreioCabeca_Ativar', v),
  fov:         v => callNative('Mapear_FOV_Valor', v),
  injetarCod:  () => callNative('Mapear_InjetarCodigos', CPP_CODIGOS_AIMBOT),
};

function renderSidebar(){

  $('sidebar').innerHTML = TABS.map(t =>
    `<button class="side-btn ${t.id===state.side?'on':''}" onclick="setSide('${t.id}')">${t.ico}</button>`
  ).join('');

}

function toggleHTML(key, label, sub){

  const on = state.tog[key];

  return `<div class="row">
    <div class="txt">
      <p class="lbl">${label}</p>
      ${sub?`<p class="sub">${sub}</p>`:''}
    </div>

    <div class="toggle ${on?'on':''}" onclick="doToggle('${key}')">
      <div class="knob">${ICO.check}</div>
    </div>
  </div>`;
}

function sliderHTML(key, label, val, max){

  return `<div class="slider-row">
    <div class="txt">
      <p class="lbl-b" style="margin:0 0 8px;">${label}</p>
      <input
        type="range"
        min="0"
        max="${max}"
        value="${val}"
        oninput="doSlide('${key}', this.value)"
      />
    </div>

    <div class="val" id="val-${key}">
      ${val}
    </div>
  </div>`;
}

function contentAim(){

  return toggleHTML(
    'aimbot',
    'precisão full',
    'Mira 100% precisa'
  )

  + toggleHTML(
    'aimSilent',
    'Aim Silent',
    'Mira disfarçada, sem detectar'
  )

  + toggleHTML(
    'rastreio',
    'aimbot legit',
    'ajuda a mira a grudar na cabeça'
  )

  + `<div class="slider-row">
      <div class="lbl-b">FOV</div>

      <div style="flex:1;">
        <input
          type="range"
          min="0"
          max="20"
          value="${state.fov}"
          oninput="doSlide('fov', this.value)"
        />
      </div>

      <div class="val" id="val-fov">
        ${state.fov}
      </div>
    </div>`;
}

function contentArma(){

  return toggleHTML(
    'semRecuo',
    'Remover Recuo',
    'Elimina todo recuo'
  )

  + toggleHTML(
    'precisao',
    'Precisão Full',
    'Mira exata no ponto'
  )

  + toggleHTML(
    'tremedeira',
    'Sem Tremedeira',
    'Mira totalmente estável'
  )

  + toggleHTML(
    'aprimorar',
    'Aprimorar Mira',
    'Mais velocidade e precisão'
  );
}

function contentDiv(){

  return toggleHTML(
    'fps120',
    'Forçar 120 FPS',
    'Desempenho máximo'
  )

  + toggleHTML(
    'otim',
    'Otimizar Jogo',
    'Melhora todo funcionamento'
  );
}

function contentSeg(){

  return `<div class="slider-row">

    <div class="txt">

      <p class="lbl-b" style="margin:0 0 4px;">
        Nível Proteção
      </p>

      <p class="sub" style="margin:0 0 10px;">
        Bypass sistema anti-ban
      </p>

      <input
        type="range"
        min="0"
        max="100"
        value="${state.seg}"
        oninput="doSlide('seg', this.value)"
      />

    </div>

    <div class="val" id="val-seg">
      ${state.seg}
    </div>

  </div>`;
}

function contentInj(){

  const st = state.inject;

  const label =
    st==='run'
      ? 'Injetando...'
      : st==='done'
        ? 'Concluído!'
        : 'Aguardando';

  const dotCls =
    st==='run'
      ? 'run'
      : st==='done'
        ? 'done'
        : 'idle';

  return `
    <button
      class="inject-btn solid"
      onclick="doInject()"
      ${st==='run'?'disabled':''}
    >
      ${ICO.bolt} INJETAR NO FF
    </button>

    <div class="status-pill">
      <span class="dot ${dotCls}"></span>
      <span>${label}</span>
    </div>

    <div class="log-block" id="log">
      ${state.log || ''}
    </div>
  `;
}

function renderContent(){

  const tab = TABS.find(t=>t.id===state.side);

  $('headIcon').innerHTML = tab.ico;
  $('headTitle').textContent = tab.title;

  let html='';

  if(state.side==='aim')
    html = contentAim();

  if(state.side==='arma')
    html = contentArma();

  if(state.side==='div')
    html = contentDiv();

  if(state.side==='seg')
    html = contentSeg();

  if(state.side==='inj')
    html = contentInj();

  const c = $('content');

  c.classList.remove('fade');

  void c.offsetWidth;

  c.classList.add('fade');

  c.innerHTML = html;
}

function render(){
  renderSidebar();
  renderContent();
}

function setSide(id){
  state.side=id;
  render();
}

function doToggle(k){

  state.tog[k] = !state.tog[k];

  bridge[k]?.(state.tog[k]);

  renderContent();
}

function doSlide(k, v){

  v = Number(v);

  if(k==='fov'){
    state.fov=v;
    bridge.fov(v);
    $('val-fov').textContent=v;
  }

  if(k==='seg'){
    state.seg=v;
    $('val-seg').textContent=v;
  }
}

function appendLog(line){

  state.log +=
    `[${new Date().toLocaleTimeString()}] ${line}\n`;

  const el = $('log');

  if(el){
    el.textContent = state.log;
    el.scrollTop = el.scrollHeight;
  }
}

function doInject(){

  if(state.inject==='run')
    return;

  state.inject='run';
  state.log='';

  renderContent();

  appendLog('🔹 Iniciando injeção...');
  appendLog('🔹 Valores carregados: 0x1000C030 | 0x1000C034');
  appendLog('🔹 Alvo: Free Fire 1.94.8');

  bridge.injetarCod();

  setTimeout(
    () => appendLog('✅ Código AimBot C++ carregado'),
    1000
  );

  setTimeout(
    () => appendLog('✅ Aimbot | AimSilent | SemRecuo prontos'),
    2000
  );

  setTimeout(() => {

    appendLog('✅ Injeção concluída!');

    state.inject='done';

    renderContent();

    appendLog('🎮 Abrindo Free Fire...');

    try{
      window.location.href='freefire://';
    }
    catch(e){
      window.open(
        'intent://com.dts.freefireth/#Intent;action=android.intent.action.MAIN;end',
        '_self'
      );
    }

  }, 3000);
}

function logout(){

  $('panel').style.display='none';

  $('login').style.display='flex';

  $('pwd').value='';
}

function tryLogin(){

  const v = $('pwd').value.trim();

  if(v === 'TERRADAGAROA'){

    $('login').style.display='none';

    $('panel').style.display='flex';

    render();

  }else{

    $('error').style.display='block';

    $('pwd').classList.add('shake');

    setTimeout(
      ()=>$('pwd').classList.remove('shake'),
      400
    );
  }
}

$('loginBtn').onclick = tryLogin;

$('pwd').addEventListener(
  'keypress',
  e=>{
    if(e.key==='Enter')
      tryLogin();
  }
);
